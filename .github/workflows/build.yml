name: Java CI

on:
  push:
    branches:
      - '**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_SDK_ROOT: /opt/hostedtoolcache/android-sdk

    strategy:
      matrix:
        abi: [arm64-v8a, armeabi-v7a]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          submodules: true
          fetch-depth: 1

      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-build-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-build-

      - name: Cache Android config (optional)
        uses: actions/cache@v3
        with:
          path: ~/.android
          key: android-config-${{ runner.os }}

      - name: Set up JDK 24
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 24
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK build-tools & platforms
        run: |
          sdkmanager --install "build-tools;34.0.0" "platforms;android-34"

      - name: Add build-tools to PATH
        run: echo "${{ env.ANDROID_SDK_ROOT }}/build-tools/34.0.0" >> $GITHUB_PATH

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Decode keystore
        run: |
          mkdir -p $HOME/.keystore
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > $HOME/.keystore/release.keystore

      - name: Get versionName
        id: get_version
        run: |
          echo "VERSION=$(grep -Po 'versionName\\s*=\\s*\\\"\\K[0-9.]+' app/build.gradle.kts)" >> $GITHUB_ENV

      - name: Build APK (${{ matrix.abi }})
        run: ./gradlew clean assembleRelease -PabiFilter=${{ matrix.abi }} --stacktrace

#      - name: List APK output
#        run: ls -lh app/build/outputs/apk/release/

      - name: Sign APK (${{ matrix.abi }})
        run: |
          for apk in app/build/outputs/apk/release/*.apk; do
            apksigner sign \
              --ks $HOME/.keystore/release.keystore \
              --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
              --ks-pass pass:"${{ secrets.KEYSTORE_PASSWORD }}" \
              --key-pass pass:"${{ secrets.KEY_PASSWORD }}" \
              --out "TachiyomiSY-${{ matrix.abi }}-v${{ env.VERSION }}.apk" "$apk"
          done

      - name: Verify signature
        run: |
          apksigner verify TachiyomiSY-${{ matrix.abi }}-v${{ env.VERSION }}.apk

      - name: Upload artifact (${{ matrix.abi }})
        uses: actions/upload-artifact@v4
        with:
          name: TachiyomiSY-${{ matrix.abi }}-v${{ env.VERSION }}
          path: TachiyomiSY-${{ matrix.abi }}-v${{ env.VERSION }}.apk

      - name: Cleanup keystore
        if: always()
        run: |
          shred -u $HOME/.keystore/release.keystore
