name: Android CI

on:
  push:
    branches: [ SYRizV3.13 ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        abi: [arm64-v8a, armeabi-v7a]
        include:
          - abi: arm64-v8a
            folder: arm64-v8a
          - abi: armeabi-v7a
            folder: armeabi-v7a

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: true
        fetch-depth: 1

    - name: Set up JDK 24
      uses: actions/setup-java@v4
      with:
        java-version: 24
        distribution: temurin

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
          .gradle/build-cache
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Install Android build-tools
      run: |
        yes | sdkmanager --install "build-tools;34.0.0" "platforms;android-34" "cmdline-tools;latest"

    - name: Add build-tools to PATH
      run: echo "${ANDROID_HOME}/build-tools/34.0.0" >> $GITHUB_PATH

    - name: Validate environment
      run: |
        java -version
        javac -version
        echo "ANDROID_HOME: $ANDROID_HOME"

    - name: Decode keystore
      run: |
        if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          echo "✅ Keystore decoded successfully"
        else
          echo "❌ KEYSTORE_BASE64 secret is missing"
          exit 1
        fi

    - name: Validate keystore
      run: |
        if [ -f release.keystore ] && [ -s release.keystore ]; then
          echo "✅ Keystore is valid"
          ls -la release.keystore
        else
          echo "❌ Keystore file is missing or empty"
          exit 1
        fi

    - name: Get app version
      id: version
      run: |
        if [ -f './app/build.gradle.kts' ]; then
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[0-9.]+' './app/build.gradle.kts' | head -1)
          if [ -z "$VERSION" ]; then
            VERSION="1.0.0"
            echo "⚠️  Using default version: $VERSION"
          else
            echo "✅ Detected version: $VERSION"
          fi
        else
          VERSION="1.0.0"
          echo "⚠️  Build file not found, using default version: $VERSION"
        fi
        echo "VERSION=$VERSION" >> $GITHUB_ENV
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Build APK for ${{ matrix.abi }}
      run: |
        ./gradlew --no-daemon clean assembleRelease -PabiFilter=${{ matrix.abi }}
        ls -la ./app/build/outputs/apk/release/

    - name: Sign APK for ${{ matrix.abi }}
      run: |
        for apk in ./app/build/outputs/apk/release/*${{ matrix.abi }}*.apk; do
          if [ -f "$apk" ]; then
            echo "📦 Signing: $(basename $apk)"
            apksigner sign \
              --ks release.keystore \
              --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
              --ks-pass pass:"${{ secrets.KEYSTORE_PASSWORD }}" \
              --key-pass pass:"${{ secrets.KEY_PASSWORD }}" \
              --out "TachiyomiSY-${{ matrix.abi }}-v${{ env.VERSION }}.apk" "$apk"
            echo "✅ Signed: TachiyomiSY-${{ matrix.abi }}-v${{ env.VERSION }}.apk"
          else
            echo "❌ No APK found for ${{ matrix.abi }}"
            exit 1
          fi
        done

    - name: Verify APK signature
      run: |
        apksigner verify --print-certs "TachiyomiSY-${{ matrix.abi }}-v${{ env.VERSION }}.apk"
        echo "✅ Signature verified successfully"

    - name: Display APK info
      run: |
        echo "📊 APK File Info:"
        ls -lh "TachiyomiSY-${{ matrix.abi }}-v${{ env.VERSION }}.apk"
        file "TachiyomiSY-${{ matrix.abi }}-v${{ env.VERSION }}.apk"

    - name: Upload ${{ matrix.abi }} APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: "TachiyomiSY-${{ matrix.abi }}-v${{ env.VERSION }}"
        path: "TachiyomiSY-${{ matrix.abi }}-v${{ env.VERSION }}.apk"
        retention-days: 30
        compression-level: 9

  # Optional: Create GitHub Release on tag
  create-release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: TachiyomiSY-*
        path: ./dist
        merge-multiple: true

    - name: List downloaded artifacts
      run: find ./dist -name "*.apk" | sort

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        files: ./dist/**/*.apk
        generate_release_notes: true
        draft: false
        prerelease: ${{ contains(github.ref, 'beta') || contains(github.ref, 'alpha') }}

  # Optional: Notification
  notify:
    needs: build
    runs-on: ubuntu-latest
    if: always()
    
    steps:
    - name: Build status notification
      run: |
        if [ "${{ needs.build.result }}" == "success" ]; then
          echo "✅ Build completed successfully!"
        else
          echo "❌ Build failed!"
          exit 1
        fi
        